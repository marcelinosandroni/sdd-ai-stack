name: Release

# Automatic publishing: push a `v*` tag and this runs.
# The version bump is done locally (npm run version:minor/major/patch), then the
# tag push fires this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (ex: 1.1.0). No v prefix."
        required: true
        type: string
      dry_run:
        description: "Validate the package without publishing"
        required: false
        default: false
        type: boolean

# Two publishes never run at once (npm rejects a duplicate version).
concurrency:
  group: release-registry
  cancel-in-progress: false

permissions:
  contents: read
  # Default is deny-by-default. Each job that needs more (id-token for npm
  # provenance, packages for GitHub Packages) declares it explicitly.

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    # A tag fires this workflow. Without this gate, `git push --tags` publishes
    # the package even when main is red: the heavy gates (typecheck, lint,
    # build, E2E) live only in the PR CI, which nobody re-reads after a merge.
    # The release does not wait on main; it re-runs the gates itself below.
    # Here we only require that CI has already succeeded on this commit.
    steps:
      - name: Require a successful CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch can run on a version that is not merged yet; in that
          # case the CI run for the commit is the only source of truth we have.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .event == "push")] | sort_by(.created_at) | last | "\(.id) \(.conclusion)"')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "::error::no CI push run found for $SHA. Merge to main and wait for CI to finish."
            exit 1
          fi
          RUN_ID="${RUN%% *}"
          CONCLUSION="${RUN##* }"
          echo "::notice::CI run $RUN_ID conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for $SHA concluded '$CONCLUSION'. Refusing to publish."
            exit 1
          fi
          echo "CI is green for $SHA"

  verify:
    name: Verify
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 for the same reason as CI: the coverage floor needs the
          # aggregated report that only exists from 24 on.
          node-version: 24
          # writes an .npmrc on the runner pointing at NODE_AUTH_TOKEN
          registry-url: https://registry.npmjs.org

      - name: Tests
        run: npm test

      - name: Coverage floor
        run: npm run check:coverage

      - name: Documentation links
        run: node SKILLS/check-docs/check-docs.mjs

      - name: Check the version and the package contents
        id: check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME:-}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '${{ inputs.version }}';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            VERSION="${{ inputs.version }}"
          fi

          # the tag must match the version in package.json
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' does not match package.json '$VERSION'"
            exit 1
          fi
          echo "publicando $VERSION"

          # No essential file may be missing from the tarball.
          #
          # These paths are asserted against `npm pack` output, so they must be the
          # real ones. The template uses a `src/` directory, which means `proxy.ts`
          # is at `template/next/src/proxy.ts` — the earlier version of this guard
          # said `template/next/src/proxy.ts` and could never have passed. A guard that
          # has never gone green is not a guard.
          npm pack --dry-run 2>&1 | tee pack.txt

          # Read TEMPLATES rather than repeating it. The previous version of this
          # guard named `template/next/...` and nothing else, so a second template
          # could be published without its `gitignore` — and an app generated with
          # no `.gitignore` ships `.env.local` to git. The failure is invisible at
          # pack time and permanent in the user's repository.
          TEMPLATES=$(node -e '
            const src = require("fs").readFileSync("lib/constants.mjs", "utf8");
            const m = src.match(/export const TEMPLATES = \[([^\]]*)\]/);
            if (!m) { console.error("TEMPLATES is no longer a literal array; update this guard"); process.exit(1); }
            process.stdout.write(m[1].split(",").map(s => s.trim().replace(/^["\x27]|["\x27]$/g, "")).filter(Boolean).join(" "));
          ')
          echo "templates in the package: $TEMPLATES"

          for f in "bin/create-sdd-ai-stack.mjs" "lib/scaffold.mjs" "AGENTS.md" \
                   "PREFLIGHT.md" "DESIGN.md" "APP-STACK.md" "stacks/README.md" \
                   "stacks/clean-code.md" "stacks/language.md" \
                   "themes/matrix/tokens.css" \
                   "SKILLS/create-feature/SKILL.md" "SKILLS/create-task/SKILL.md" \
                   "SKILLS/check-rules/check-rules.mjs" "SKILLS/check-docs/SKILL.md"; do
            grep -q "$f" pack.txt || { echo "::error::missing from the package: $f"; exit 1; }
          done

          # Per template: the files without which a generated app is broken. These
          # paths are asserted against `npm pack` output, so they must be the real
          # ones — the template uses `src/`, which puts `proxy.ts` at
          # `src/proxy.ts`. The earlier version of this guard said
          # `template/next/src/proxy.ts` and could never have passed, and a guard
          # that has never gone green is not a guard.
          for t in $TEMPLATES; do
            for f in "template/$t/gitignore" "template/$t/package.json" \
                     "template/$t/src/app/theme.css"; do
              grep -q "$f" pack.txt || { echo "::error::missing from the package: $f"; exit 1; }
            done
          done

          # Next-only, because these files only mean something in a Next app.
          if echo "$TEMPLATES" | grep -qw next; then
            for f in "template/next/src/proxy.ts" "template/next/components.json"; do
              grep -q "$f" pack.txt || { echo "::error::missing from the package: $f"; exit 1; }
            done
          fi

          echo "all essential files are in the tarball"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The heavy template gates (typecheck, lint, unit, build, E2E) live in
      # CI.yml and are re-run here, right before the publish. A release must
      # never ship a package whose template does not build.
      - name: Re-run the template gates
        run: |
          set -euo pipefail
          # Every template, not just the default one. A release must never ship a
          # package containing a template that does not build — and "the default one"
          # is the version of that sentence that let a broken second template through.
          TEMPLATES=$(node -e '
            const src = require("fs").readFileSync("lib/constants.mjs", "utf8");
            const m = src.match(/export const TEMPLATES = \[([^\]]*)\]/);
            if (!m) { console.error("TEMPLATES is no longer a literal array; update this step"); process.exit(1); }
            process.stdout.write(m[1].split(",").map(s => s.trim().replace(/^["\x27]|["\x27]$/g, "")).filter(Boolean).join(" "));
          ')

          for t in $TEMPLATES; do
            echo "::group::template $t"
            rm -rf ".sandbox-$t"
            node bin/create-sdd-ai-stack.mjs ".sandbox-$t" --template "$t" --no-install --shortcuts stub --yes
            cd ".sandbox-$t"
            npm install --no-audit --no-fund
            npm run typecheck
            npm run lint
            npm run test
            npm run build
            cd - >/dev/null
            echo "::endgroup::"
          done
          rm -rf .sandbox-*

  publish:
    name: Publish npm
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/create-sdd-ai-stack
    permissions:
      contents: read
      # Only this job needs OIDC, for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          # Node 24, not 22. `prepublishOnly` runs `check:coverage`, which
          # refuses to run below 24 because the test runner only aggregates
          # coverage across its child processes from 24 on. On 22 the publish
          # died in its own gate before reaching npm.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) needs npm >= 11.5.1, and the runner ships an
      # older npm, so without this the OIDC never engages and the publish fails.
      - name: Upgrade npm to a version with OIDC support
        run: npm install -g npm@latest

      # Skip when the version is already on npmjs.
      #
      # A tag publishes both registries, but a failure in one does not undo the
      # other: tag v0.3.1 landed on npmjs while the GitHub Packages job died on
      # ENEADAUTH. Without this, retrying the fix would fail here with
      # EPUBLISHCONFLICT and bury the real work under a red job that is not the
      # problem. The release must be resumable from whichever registry it reached.
      - name: Skip if this version is already on npmjs
        id: exists
        run: |
          set -euo pipefail
          if npm view create-sdd-ai-stack@"${{ needs.verify.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ needs.verify.outputs.version }} is already on npmjs; not republishing"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # o job anterior alterou package.json num checkout descartável;
      # here (clean checkout) the dispatch version has to be reapplied
      - name: Apply the dispatch version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Check the version
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::version mismatch: '$ACTUAL' != '${{ needs.verify.outputs.version }}'"
            exit 1
          fi
          echo "publishing create-sdd-ai-stack@$ACTUAL"

      # No auth step. The npm job authenticates with Trusted Publishing (OIDC)
      # through `id-token: write` above; a NODE_AUTH_TOKEN here would make npm
      # prefer it and ignore the OIDC entirely.
      #
      # An earlier version branched on secrets.NPM_TOKEN, which described two
      # modes. That secret is deleted, so the branch always took the early exit
      # and never did anything — a step that only existed to announce that it
      # was unnecessary.

      # Do NOT set NODE_AUTH_TOKEN here. With it present, the npm ignores the OIDC.
      #
      # `--provenance` is explicit and must NOT come from publishConfig: the npm
      # reads publishConfig with priority over a CLI flag and over the env, so
      # leaving `provenance: true` there breaks the local bootstrap with
      # "Automatic provenance generation not supported for provider: null".
      - name: Publish
        if: ${{ !inputs.dry_run && steps.exists.outputs.already == 'false' }}
        run: npm publish --access public --provenance

      - name: Simulate (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

  # ─────────────────────────────────────────────────────────────────
  # GitHub Packages. Runs in PARALLEL with the npm job: a failure on one
  # registry does not cancel the other, and both get the same version.
  #
  # GitHub Packages ONLY accepts scoped packages (@owner/name). Our npm name is
  # unscoped, so this job rewrites `name` to the scoped form for the publish and
  # then restores nothing — the checkout is disposable.
  #
  # It also strips `publishConfig`, because npm reads that with higher precedence
  # than CLI flags: `access: public` and `provenance` are npm-registry-only and
  # both are rejected by GitHub Packages.
  # ─────────────────────────────────────────────────────────────────
  publish-github:
    name: Publish GitHub
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    environment:
      name: github-packages
      url: https://github.com/users/marcelinosandroni/packages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # No `scope` on setup-node: it maps @marcelinosandroni/* to a registry
      # for EVERY npm command in the job, which is how the gate suite ended up
      # resolving this repository's own dependencies from GitHub Packages.
      #
      # The auth mapping is written by hand instead, so it applies to the
      # publish and to nothing else. `setup-node`'s `registry-url` would write a
      # global `//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}`, and the
      # dry run proved that removing it breaks auth (ENEEDAUTH) while keeping
      # it breaks the gates. The scope mapping belongs in the repository's
      # .npmrc; the token mapping belongs to the step that has the token.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate against GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same rationale as the npm job: one registry succeeding must not block
      # the other. GitHub Packages rejects a duplicate version too.
      - name: Skip if this version is already on GitHub Packages
        id: exists
        run: |
          set -euo pipefail
          SCOPED="@marcelinosandroni/create-sdd-ai-stack@${{ needs.verify.outputs.version }}"
          if npm view "$SCOPED" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$SCOPED is already on GitHub Packages; not republishing"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the dispatch version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Check the version
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::version mismatch: '$ACTUAL' != '${{ needs.verify.outputs.version }}'"
            exit 1
          fi

      # GitHub Packages links the package to the repo through `repository.url`,
      # and the scope must match the account that owns the repo.
      - name: Scope the name and drop the npm-only publishConfig
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const owner = 'marcelinosandroni';
            if (!p.repository?.url) throw new Error('repository.url is required by GitHub Packages');
            if (!p.repository.url.includes(owner)) {
              throw new Error('repository.url must point at ' + owner + ' for the scope to match');
            }
            p.name = '@' + owner + '/' + p.name;
            // npm reads publishConfig ABOVE CLI flags, so it has to go entirely
            delete p.publishConfig;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('scoped name: ' + p.name);
          "

      # GitHub Packages is reached through the token, not through a global
      # registry rewrite. `--registry` says where to publish; the scope mapping
      # in .npmrc resolves @marcelinosandroni/* there without every unrelated
      # npm command in the job inheriting the same registry.
      #
      # `--ignore-scripts` is REQUIRED, and it is not an optimisation.
      #
      # This job rewrites the name to @marcelinosandroni/… first, because
      # GitHub Packages only accepts scoped names. `prepublishOnly` then runs
      # the gate suite — and tests/docs.test.mjs asserts the npm name stays
      # unscoped. The job was invalidating its own gate, which is why it died
      # 0.3s into the first test file with an error that named neither the job
      # nor the cause.
      #
      # The `needs: verify` key above is the guarantee those skipped gates were
      # already run: verify is a hard dependency, it checks out the same SHA, and
      # it runs npm test, the coverage floor, the docs links and the template
      # gates. Nothing is lost, and the contradiction is gone.
      - name: Publish
        if: ${{ !inputs.dry_run && steps.exists.outputs.already == 'false' }}
        run: npm publish --provenance=false --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --provenance=false --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
