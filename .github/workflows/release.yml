name: Release

# Publicação AUTOMÁTICA: basta dar push numa tag `v*`.
# A version bump é feita localmente (npm run version:minor/major/patch),
# depois o push da tag dispara este workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: 1.1.0). Não use prefixo v."
        required: true
        type: string
      dry_run:
        description: "Só valida o pacote, não publica de verdade"
        required: false
        default: false
        type: boolean

# Impede dois publishes simultâneos (npm rejeita versão duplicada).
concurrency:
  group: release-registry
  cancel-in-progress: false

permissions:
  contents: read
  # Default is deny-by-default. Each job that needs more (id-token for npm
  # provenance, packages for GitHub Packages) declares it explicitly.

jobs:
  guard:
    name: Guard (CI must be green on this commit)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # A tag dispara este workflow. Sem este gate, `git push --tags` publica o
    # pacote mesmo com a main vermelha — os gates pesados do CI (typecheck, lint,
    # build, E2E) ficam só no CI de PR, que ninguém reassiste depois do merge.
    # A release NÃO espera a main: ela re-executa os gates localmente abaixo.
    # Aqui só exigimos que o CI tenha rodado com sucesso neste commit.
    steps:
      - name: Require a successful CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # O workflow_dispatch pode rodar numa versão ainda não mergeada; nesse
          # caso o CI do commit é a única fonte de verdade que temos.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .event == "push")] | sort_by(.created_at) | last | "\(.id) \(.conclusion)"')
          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "::error::no CI push run found for $SHA. Merge to main and wait for CI to finish."
            exit 1
          fi
          RUN_ID="${RUN%% *}"
          CONCLUSION="${RUN##* }"
          echo "::notice::CI run $RUN_ID conclusion: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for $SHA concluded '$CONCLUSION'. Refusing to publish."
            exit 1
          fi
          echo "CI is green for $SHA"

  verify:
    name: Verify package
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Node 24 for the same reason as CI: the coverage floor needs the
          # aggregated report that only exists from 24 on.
          node-version: 24
          # gera um .npmrc no runner apontando para NODE_AUTH_TOKEN
          registry-url: https://registry.npmjs.org

      - name: Tests
        run: npm test

      - name: Coverage floor
        run: npm run check:coverage

      - name: Documentation links
        run: node SKILLS/check-docs/check-docs.mjs

      - name: Check the version and the package contents
        id: check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME:-}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '${{ inputs.version }}';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            VERSION="${{ inputs.version }}"
          fi

          # a tag tem que bater com a versão do package.json
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' não bate com package.json '$VERSION'"
            exit 1
          fi
          echo "publicando $VERSION"

          # nenhum arquivo essencial pode faltar do tarball
          npm pack --dry-run 2>&1 | tee pack.txt
          for f in "bin/create-sdd-ai-stack.mjs" "lib/scaffold.mjs" "AGENTS.md" "stacks/next.md" \
                   "DESIGN.md" "APP-STACK.md" "stacks/README.md" "template/next/gitignore" \
                   "template/next/package.json" "template/next/proxy.ts" \
                   "template/next/components.json" "SKILLS/create-feature/SKILL.md"; do
            grep -q "$f" pack.txt || { echo "::error::faltando no pacote: $f"; exit 1; }
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The heavy template gates (typecheck, lint, unit, build, E2E) live in
      # CI.yml and are re-run here, right before the publish. A release must
      # never ship a package whose template does not build.
      - name: Re-run the template gates
        run: |
          set -euo pipefail
          node bin/create-sdd-ai-stack.mjs .sandbox --no-install --shortcuts stub --yes
          cd .sandbox
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run test
          npm run build

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/create-sdd-ai-stack
    permissions:
      contents: read
      # Only this job needs OIDC, for npm provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) exige npm >= 11.5.1. O Node 22 do runner vem
      # com o npm 10.x, então sem isto o OIDC nunca engata e o publish falha.
      - name: Upgrade npm to a version with OIDC support
        run: npm install -g npm@latest

      # o job anterior alterou package.json num checkout descartável;
      # aqui (checkout limpo) precisamos reaplicar a versão do dispatch
      - name: Apply the dispatch version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Check the version
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::version mismatch: '$ACTUAL' != '${{ needs.verify.outputs.version }}'"
            exit 1
          fi
          echo "publishing create-sdd-ai-stack@$ACTUAL"

      # ── Autenticação: dois modos, o npm escolhe ──
      #
      # 1. TEMPO: o secret NPM_TOKEN. Injetamos NODE_AUTH_TOKEN no ambiente dos
      #    próximos passos. O setup-node (registry-url) já deixou no ~/.npmrc do
      #    runner a linha `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
      #
      # 2. SEM TOKEN: Trusted Publishing (OIDC). Não escrevemos NADA — o npm só
      #    engata o OIDC quando o auth está ausente.
      #
      # ⚠️ We do NOT write the token to a file. The project .npmrc has priority
      #    sobre o ~/.npmrc do runner, e um authToken vazio lá dentro quebra
      #    TUDO silenciosamente (401 no whoami, 404 no PUT de primeira publicação).
      - name: Authenticate
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN ausente — publicando via Trusted Publishing (OIDC)."
            echo "::notice::configure em npmjs.com → create-sdd-ai-stack → Settings → Trusted publishing"
            echo "::notice::(owner: marcelinosandroni · repo: sdd-ai-stack · workflow: release.yml)"
            exit 0
          fi
          echo "::notice::NPM_TOKEN presente — publicando por token."
          echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ⚠️ NÃO defina NODE_AUTH_TOKEN aqui. Com ele presente, o npm ignora o OIDC.
      #
      # `--provenance` é explícito e NÃO pode vir do publishConfig: o npm lê
      # `publishConfig` com prioridade sobre flag de CLI e sobre env, então
      # deixar `provenance: true` lá quebra o bootstrap local com
      # "Automatic provenance generation not supported for provider: null".
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance

      - name: Simulate (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

  # ─────────────────────────────────────────────────────────────────
  # GitHub Packages. Runs in PARALLEL with the npm job: a failure on one
  # registry does not cancel the other, and both get the same version.
  #
  # GitHub Packages ONLY accepts scoped packages (@owner/name). Our npm name is
  # unscoped, so this job rewrites `name` to the scoped form for the publish and
  # then restores nothing — the checkout is disposable.
  #
  # It also strips `publishConfig`, because npm reads that with higher precedence
  # than CLI flags: `access: public` and `provenance` are npm-registry-only and
  # both are rejected by GitHub Packages.
  # ─────────────────────────────────────────────────────────────────
  publish-github:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: github-packages
      url: https://github.com/users/marcelinosandroni/packages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@marcelinosandroni'

      - name: Apply the dispatch version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Check the version
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::version mismatch: '$ACTUAL' != '${{ needs.verify.outputs.version }}'"
            exit 1
          fi

      # GitHub Packages links the package to the repo through `repository.url`,
      # and the scope must match the account that owns the repo.
      - name: Scope the name and drop the npm-only publishConfig
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const owner = 'marcelinosandroni';
            if (!p.repository?.url) throw new Error('repository.url is required by GitHub Packages');
            if (!p.repository.url.includes(owner)) {
              throw new Error('repository.url must point at ' + owner + ' for the scope to match');
            }
            p.name = '@' + owner + '/' + p.name;
            // npm reads publishConfig ABOVE CLI flags, so it has to go entirely
            delete p.publishConfig;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('scoped name: ' + p.name);
          "

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulate (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --provenance=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
