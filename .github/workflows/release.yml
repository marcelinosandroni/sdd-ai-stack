name: Release

# Publicação AUTOMÁTICA: basta dar push numa tag `v*`.
# A version bump é feita localmente (npm run version:minor/major/patch),
# depois o push da tag dispara este workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: 1.1.0). Não use prefixo v."
        required: true
        type: string
      dry_run:
        description: "Só valida o pacote, não publica de verdade"
        required: false
        default: false
        type: boolean

# Impede dois publishes simultâneos (npm rejeita versão duplicada).
concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read
  # necessário para o --provenance (assinatura do pacote pelo GitHub OIDC)
  id-token: write

jobs:
  verify:
    name: Verifica pacote
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # gera um .npmrc no runner apontando para NODE_AUTH_TOKEN
          registry-url: https://registry.npmjs.org

      - name: Testes
        run: npm test

      - name: Links da documentação
        run: node SKILLS/check-docs/check-docs.mjs

      - name: Confere versão e conteúdo do pacote
        id: check
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME:-}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '${{ inputs.version }}';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            VERSION="${{ inputs.version }}"
          fi

          # a tag tem que bater com a versão do package.json
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag '$TAG' não bate com package.json '$VERSION'"
            exit 1
          fi
          echo "publicando $VERSION"

          # nenhum arquivo essencial pode faltar do tarball
          npm pack --dry-run 2>&1 | tee pack.txt
          for f in "bin/create-sdd-ai-stack.mjs" "lib/scaffold.mjs" "AGENTS.md" "stacks/next.md" \
                   "DESIGN.md" "APP-STACK.md" "stacks/README.md" "template/next/gitignore" \
                   "template/next/package.json" "SKILLS/create-feature/SKILL.md"; do
            grep -q "$f" pack.txt || { echo "::error::faltando no pacote: $f"; exit 1; }
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish:
    name: Publica no npm
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/create-sdd-ai-stack
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) exige npm >= 11.5.1. O Node 22 do runner vem
      # com o npm 10.x, então sem isto o OIDC nunca engata e o publish falha.
      - name: Sobe o npm para a versão com suporte a OIDC
        run: npm install -g npm@latest

      # o job anterior alterou package.json num checkout descartável;
      # aqui (checkout limpo) precisamos reaplicar a versão do dispatch
      - name: Aplica a versão do dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ inputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Confere a versão
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "${{ needs.verify.outputs.version }}" ]; then
            echo "::error::versão divergente: '$ACTUAL' != '${{ needs.verify.outputs.version }}'"
            exit 1
          fi
          echo "publicando create-sdd-ai-stack@$ACTUAL"

      # ── Autenticação: dois modos, o npm escolhe ──
      #
      # 1. TEMPO: o secret NPM_TOKEN. Injetamos NODE_AUTH_TOKEN no ambiente dos
      #    próximos passos. O setup-node (registry-url) já deixou no ~/.npmrc do
      #    runner a linha `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
      #
      # 2. SEM TOKEN: Trusted Publishing (OIDC). Não escrevemos NADA — o npm só
      #    engata o OIDC quando o auth está ausente.
      #
      # ⚠️ We do NOT write the token to a file. The project .npmrc has priority
      #    sobre o ~/.npmrc do runner, e um authToken vazio lá dentro quebra
      #    TUDO silenciosamente (401 no whoami, 404 no PUT de primeira publicação).
      - name: Autentica
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN ausente — publicando via Trusted Publishing (OIDC)."
            echo "::notice::configure em npmjs.com → create-sdd-ai-stack → Settings → Trusted publishing"
            echo "::notice::(owner: marcelinosandroni · repo: sdd-ai-stack · workflow: release.yml)"
            exit 0
          fi
          echo "::notice::NPM_TOKEN presente — publicando por token."
          echo "NODE_AUTH_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ⚠️ NÃO defina NODE_AUTH_TOKEN aqui. Com ele presente, o npm ignora o OIDC.
      #
      # `--provenance` é explícito e NÃO pode vir do publishConfig: o npm lê
      # `publishConfig` com prioridade sobre flag de CLI e sobre env, então
      # deixar `provenance: true` lá quebra o bootstrap local com
      # "Automatic provenance generation not supported for provider: null".
      - name: Publica
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance

      - name: Simula (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public
