name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. Nothing here needs to write.
permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24, not 22: `node --test --experimental-test-coverage` only
          # aggregates coverage across the test-runner child processes from 24
          # on. On 22 the summary is empty and the coverage floor reads as zero.
          node-version: 24

      - name: CLI and scaffold tests
        run: npm test

      - name: "Coverage floor (line 95, branch 85, func 90)"
        run: npm run check:coverage

      - name: Rules are executable
        run: npm run check:rules

      - name: Documentation links
        run: node SKILLS/check-docs/check-docs.mjs

      # The numbers this repository states about itself. It claimed 27 tests
      # while running 79, and nothing was red, because a number in prose is not
      # a check. A document that misstates what it could have verified teaches
      # an agent to trust no document.
      - name: The documented numbers are true
        run: npm run check:facts

      - name: Check the package contents
        run: npm pack --dry-run

  # The only job that tests what the template EMITS rather than the template.
  #
  # Every other job validates this repository, which has the three files a
  # generated app lacks: `tests/cli-flags.test.mjs`, its own `package.json`, and
  # `.github/workflows/release.yml`. Six bugs reached main green because of that
  # gap — three skills that crash on ENOENT where they land, a dead link in the
  # task template, this repository's test counts shipped in someone else's
  # PREFLIGHT, and `create-feature` generating a slice with no test.
  #
  # Fast path only (~1s): no install, no browser. The Template job already proves
  # the generated app builds and passes E2E; this proves the RULES and the SKILLS
  # work in it, which is the part nothing else covers.
  dogfood:
    name: Dogfood
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate an app and walk the cycle the rules describe
        run: node SKILLS/dogfood/dogfood.mjs

      # The slow path, weekly rather than per-PR: it installs ~100 packages and
      # downloads browsers, which is a lot of minutes to re-prove on every commit.
      # `--full` is what a release runs.
      - name: Full dogfood (install + build)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node SKILLS/dogfood/dogfood.mjs --full

  # Every template, from one list.
  #
  # This used to be a single hardcoded job that generated `next` and ran its gates.
  # Adding a second template therefore meant remembering to come back here — and
  # nothing would have said so.
  #
  # It was first written as a `strategy.matrix` fed by a `templates` job that emitted
  # the list as a JSON output. Every job in the run then passed and the RUN still
  # failed, with no failing job to look at: GitHub's planner dropped the matrix
  # entirely. That is a genuinely awful failure mode — a workflow that reports red
  # with nothing red in it — so this is a sequential loop instead. It costs
  # parallelism, which is the price of not depending on the planner.
  #
  # The list is read from `lib/constants.mjs`, the same constant the CLI validates
  # against. A hardcoded matrix list would be a second enumeration, and the failure
  # mode is the quiet one this repository keeps meeting: a template ships, the matrix
  # does not mention it, and CI is green while testing nothing new.
  template:
    name: Template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # No `cache: npm`: the root is a zero-dependency CLI package, and the app is
        # generated into .sandbox-<template> (which has no lockfile until install).
        with:
          node-version: 22

      - name: Read TEMPLATES
        run: |
          set -euo pipefail
          # If TEMPLATES stops being a literal array, this fails loudly instead of
          # silently gating nothing — the failure mode this phase exists to remove.
          list=$(node -e '
            const src = require("fs").readFileSync("lib/constants.mjs", "utf8");
            const m = src.match(/export const TEMPLATES = \[([^\]]*)\]/);
            if (!m) { console.error("TEMPLATES is no longer a literal array; update every reader"); process.exit(1); }
            process.stdout.write(m[1].split(",").map(s => s.trim().replace(/^["\x27]|["\x27]$/g, "")).filter(Boolean).join(" "));
          ')
          echo "TEMPLATES=$list"
          case "$list" in
            *[![:space:]]*) ;;
            *) echo "::error::TEMPLATES parsed as empty — the job would gate nothing"; exit 1 ;;
          esac
          echo "TEMPLATES=$list" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Generate, gate, and build every template
        run: |
          set -euo pipefail
          for t in $TEMPLATES; do
            echo "::group::template $t"
            app=".sandbox-$t"
            rm -rf "$app"

            node bin/create-sdd-ai-stack.mjs "$app" --template "$t" --no-install --shortcuts stub --yes

            cd "$app"
            npm install --no-audit --no-fund
            npm run typecheck
            npm run lint
            npm run test
            npm run build

            # E2E runs against the production build, never the dev server. A dev
            # server compiles on demand, so a route that only breaks after bundling
            # passes E2E and fails the user.
            npm run test:e2e

            # Back to the repository root, and only there. `cd -` already returns
            # to where the loop started, so a further `cd ..` steps outside the
            # checkout — and the theme check below then fails on a file that
            # demonstrably exists, which is the most confusing possible error.
            cd - >/dev/null

            # The token file must arrive unchanged. A generated app carrying its own
            # copy of the design is how two apps drift into two design systems with
            # one name.
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              const a = readFileSync('themes/executive/tokens.css', 'utf8').trim();
              const b = readFileSync('$app/src/app/theme.css', 'utf8').trim();
              if (a !== b) {
                console.error('src/app/theme.css differs from themes/executive/tokens.css');
                process.exit(1);
              }
              console.log('theme is byte-identical');
            "

            rm -rf "$app"
            echo "::endgroup::"
          done
  site:
    name: Site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Unit tests
        working-directory: site
        run: npm run test

      # A dead anchor on a marketing page is a broken promise to the visitor,
      # and nothing else in the repo would catch it.
      - name: Install the browser
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: site
        run: npm run test:e2e

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit the generated app
        run: |
          set -euo pipefail
          node bin/create-sdd-ai-stack.mjs .audit --no-install --shortcuts stub --yes
          cd .audit
          npm install --no-audit --no-fund
          # --omit=dev: o app vai pra produção, o resto é ferramenta.
          # --audit-level=high: só vulnerabilidades altas/-críticas bloqueiam.
          npm audit --omit=dev --audit-level=high

  actions:
    name: Actions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # GitHub deprecou o runtime Node 20 dos runners. Cada action presa numa
      # versão antiga emite um warning ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION
      # across EVERY job, and that noise hides the real warnings.
      #
      # The previous regex accepted v4, which is exactly the broken version.
      # Agora o piso é explícito por action.
      - name: No action on a deprecated Node 20 runtime
        run: |
          set -euo pipefail
          # action:major-minor-minima. Anything below these targets Node 20.
          declare -A MIN=(
            [actions/checkout]=5
            [actions/setup-node]=5
          )
          failed=0
          for action in "${!MIN[@]}"; do
            required="${MIN[$action]}"
            while read -r file line; do
              version="${line##*@v}"
              version="${version%%[^0-9]*}"
              if [ -n "$version" ] && [ "$version" -lt "$required" ]; then
                echo "::error file=$file::$line::$action@v$version is below v$required (Node 20 runtime)"
                failed=1
              fi
            done < <(grep -rnoE "$action@v[0-9]+" .github/workflows | tr ':' ' ')
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "all actions are on a maintained runtime"

      - name: No floating runner image
        run: |
          set -euo pipefail
          # `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19. A floating label
          # means a silent runner change under a green build.
          if grep -rn "ubuntu-latest" .github/workflows; then
            echo "::error::pin the runner image. ubuntu-latest migrates to Ubuntu 26."
            exit 1
          fi
          echo "runner image is pinned"
