version: 2
updates:
  - package-ecosystem: npm
    directory: /template/next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, template]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @types/node describes the runtime API. The CI pins node-version 22, so a
      # 26.x type package would describe functions the runtime does not have —
      # a worse failure than an old type.
      - dependency-name: "@types/node"
        update-types: ["minor", "patch"]
    groups:
      next:
        patterns: ["next", "react", "react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@playwright/*"]
      typescript:
        patterns: ["typescript", "@types/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
